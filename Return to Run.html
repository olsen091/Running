<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return to Run Plan</title>

<style>
:root{
    --easy:#d4edda;
    --cross:#d1ecf1;
    --long:#ffe5b4;
    --stride:#e8d7ff;
    --rest:#f5f5f5;
    --header:#2c3e50;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
    background:#fafafa;
}

h1,h2{
    text-align:center;
}

.note{
    max-width:1000px;
    margin:0 auto 20px;
    background:#fff8dc;
    padding:15px;
    border-left:5px solid #f1c40f;
}

.week{
    margin-bottom:30px;
}

.week-header{
    background:var(--header);
    color:white;
    padding:10px;
    font-weight:bold;
    border-radius:6px 6px 0 0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    background:#ccc;
}
.weekday{
    display:none;
}
    
.day-header{
    background:#34495e;
    color:white;
    text-align:center;
    padding:8px;
    font-weight:bold;
}

.day{
    min-height:90px;
    padding:10px;
    cursor:pointer;
    background:white;
    transition:.2s;
}

.day:hover{
    transform:scale(1.02);
}

.easy{background:var(--easy);}
.cross{background:var(--cross);}
.long{background:var(--long);}
.stride{background:var(--stride);}
.rest{background:var(--rest);}

.day-title{
    font-weight:bold;
    margin-bottom:5px;
}

.mileage{
    font-size:.9em;
}

.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
}

.modal-content{
    background:white;
    max-width:700px;
    margin:5% auto;
    padding:25px;
    border-radius:8px;
}

.close{
    float:right;
    font-size:30px;
    cursor:pointer;
}

.legend{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin:20px 0;
}

.legend div{
    padding:8px 12px;
    border-radius:4px;
}

.weekday{
    font-size:.85rem;
    color:#555;
    font-weight:bold;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
}

@media(max-width:768px){

    .weekday{
        display:block;
    }
    
    .grid{
        display:flex;
        flex-direction:column;
        gap:6px;
        background:none;
    }

    .day-header{
        display:none;
    }

    .day{
        min-height:auto;
        padding:14px;
        border-radius:8px;
        border:1px solid rgba(0,0,0,.08);
    }

    .week{
        margin-bottom:20px;
    }

    .week-header{
        border-radius:8px;
    }
}
</style>
</head>
<body>

<h1>4-Week Return to Running Plan</h1>

<div class="note">
<strong>Important:</strong> Progress only if pain remains ≤2/10 during runs,
there is no limping, and swelling does not increase the next day.
All running should be conversational effort.
</div>

<div class="legend">
<div class="easy">Easy Run</div>
<div class="cross">Bike / Cross Train</div>
<div class="long">Long Run</div>
<div class="stride">Strides</div>
<div class="rest">Rest</div>
</div>

<div id="calendar"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>

const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const plan = [

{
week:"Week 1 (8 Miles)",
total:"8 Miles",
days:[
["12 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 5 times"],
["Bike 40 min","cross","40 minutes bike plus ankle mobility work."],
["12 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 5 times"],
["Bike 40 min","cross","40 minutes bike plus ankle mobility work."],
["16 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 7 times"],
["16 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 7 times"],
["Rest","rest","Recovery day."]
]
},

{
week:"Week 2 (11 Miles)",
total:"11 Miles",
days:[
["22 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 10 times"],
["Bike 45 min","cross","40 minutes bike plus ankle mobility work."],
["22 min Run/Walk","easy","Run 2 min @ easy pace then walk 1 min.  Repeat 10 times"],
["Bike 45 min","cross","40 minutes bike plus ankle mobility work."],
["24 min Run/Walk","easy","Run 3 min @ easy pace then walk 1 min.  Repeat 7 times"],
["24 min Run/Walk","easy","Run 3 min @ easy pace then walk 1 min.  Repeat 7 times"],
["Rest","rest","Recovery day."]
]
},

{
week:"Week 3 (14 Miles)",
total:"14 Miles",
days:[
["24 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 5 times"],
["Bike 50 min","cross","40 minutes bike plus ankle mobility work."],
["24 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 5 times"],
["Bike 50 min","cross","40 minutes bike plus ankle mobility work."],
["32 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 7 times"],
["32 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 7 times"],
["Rest","rest","Recovery day."]
]
},

{
week:"Week 4 (17 Miles)",
total:"17 Miles",
days:[
["40 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 9 times"],
["Bike 50 min","cross","40 minutes bike plus ankle mobility work."],
["40 min Run/Walk","easy","Run 4 min @ easy pace then walk 1 min.  Repeat 9 times"],
["Bike 50 min","cross","40 minutes bike plus ankle mobility work."],
["42 min Run/Walk","easy","Run 6 min @ easy pace then walk 1 min.  Repeat 6 times"],
["42 min Run/Walk","easy","Run 6 min @ easy pace then walk 1 min.  Repeat 6 times"],
["Rest","rest","Recovery day."]
]
},



];

const calendar = document.getElementById("calendar");

plan.forEach(week => {

let html = `
<div class="week">
<div class="week-header">${week.week} • Total: ${week.total}</div>
<div class="grid">
`;

weekdays.forEach(day=>{
html += `<div class="day-header">${day}</div>`;
});

week.days.forEach((day,index)=>{
html += `
<div class="day ${day[1]}" onclick="showModal('${day[0]}', \`${day[2]}\`)">
    <div class="weekday">${weekdays[index]}</div>
    <div class="day-title">${day[0]}</div>
</div>
`;
});

html += `</div></div>`;
calendar.innerHTML += html;

});

function showModal(title,detail){
document.getElementById("modalBody").innerHTML =
`<h2>${title}</h2><p>${detail}</p>`;
document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

window.onclick=function(e){
const modal=document.getElementById("modal");
if(e.target===modal){
modal.style.display="none";
}
}

</script>

</body>
</html>
